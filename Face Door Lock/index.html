<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Face Recognition Door System</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { 
    font-family: 'Segoe UI', Tahoma, sans-serif; 
    text-align: center; 
    background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
    min-height: 100vh;
    padding: 20px;
  }
  .container {
    max-width: 800px;
    margin: 0 auto;
    background: white;
    border-radius: 15px;
    padding: 30px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.2);
  }
  h1 { 
    color: #333; 
    margin-bottom: 10px;
    font-size: 2em;
  }
  .subtitle {
    color: #666;
    margin-bottom: 30px;
    font-size: 0.9em;
  }
  
  /* Login Screen */
  #loginScreen {
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 400px;
  }
  .login-icon {
    font-size: 4em;
    margin-bottom: 20px;
  }
  .login-title {
    font-size: 1.8em;
    color: #333;
    margin-bottom: 10px;
  }
  .login-subtitle {
    color: #666;
    margin-bottom: 30px;
  }
  .password-input-group {
    display: flex;
    flex-direction: column;
    gap: 15px;
    width: 100%;
    max-width: 350px;
  }
  .password-wrapper {
    position: relative;
    width: 100%;
  }
  #passwordInput {
    width: 100%;
    padding: 15px 45px 15px 20px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    transition: border-color 0.3s;
  }
  #passwordInput:focus {
    outline: none;
    border-color: #667eea;
  }
  .toggle-password {
    position: absolute;
    right: 15px;
    top: 50%;
    transform: translateY(-50%);
    cursor: pointer;
    font-size: 1.2em;
    user-select: none;
  }
  .login-error {
    color: #e53e3e;
    font-size: 0.9em;
    min-height: 20px;
    margin-top: -5px;
  }
  
  /* Main App (hidden by default) */
  #mainApp {
    display: none;
  }
  
  #preview { 
    border: 3px solid #667eea; 
    border-radius: 10px;
    margin: 20px auto;
    display: none;
    max-width: 100%;
    max-height: 480px;
    background: #000;
  }
  .upload-area {
    border: 3px dashed #667eea;
    border-radius: 10px;
    padding: 40px;
    margin: 20px 0;
    background: #f7fafc;
    cursor: pointer;
    transition: all 0.3s;
  }
  .upload-area:hover {
    background: #edf2f7;
    border-color: #5568d3;
  }
  .upload-area.dragover {
    background: #e6fffa;
    border-color: #38b2ac;
  }
  .upload-icon {
    font-size: 3em;
    margin-bottom: 10px;
  }
  .upload-text {
    color: #4a5568;
    font-size: 1.1em;
    margin-bottom: 10px;
  }
  .upload-hint {
    color: #718096;
    font-size: 0.9em;
  }
  input[type="file"] {
    display: none;
  }
  .input-group {
    margin: 20px 0;
  }
  input[type="text"] {
    padding: 12px 20px;
    font-size: 16px;
    border: 2px solid #ddd;
    border-radius: 8px;
    width: 100%;
    max-width: 300px;
    transition: border-color 0.3s;
  }
  input[type="text"]:focus {
    outline: none;
    border-color: #667eea;
  }
  .button-group {
    margin: 20px 0;
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
  }
  button { 
    padding: 12px 30px; 
    font-size: 16px;
    border: none;
    border-radius: 8px;
    cursor: pointer;
    transition: all 0.3s;
    font-weight: 600;
  }
  button:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.2);
  }
  button:active {
    transform: translateY(0);
  }
  button:disabled {
    opacity: 0.5;
    cursor: not-allowed;
    transform: none;
  }
  .btn-primary {
    background: #667eea;
    color: white;
  }
  .btn-primary:hover:not(:disabled) {
    background: #5568d3;
  }
  .btn-secondary {
    background: #48bb78;
    color: white;
  }
  .btn-secondary:hover:not(:disabled) {
    background: #38a169;
  }
  .btn-info {
    background: #4299e1;
    color: white;
  }
  .btn-info:hover:not(:disabled) {
    background: #3182ce;
  }
  .btn-danger {
    background: #f56565;
    color: white;
  }
  .btn-danger:hover:not(:disabled) {
    background: #e53e3e;
  }
  .btn-warning {
    background: #ed8936;
    color: white;
  }
  .btn-warning:hover:not(:disabled) {
    background: #dd6b20;
  }
  .btn-logout {
    background: #718096;
    color: white;
    padding: 8px 20px;
    font-size: 14px;
  }
  .btn-logout:hover {
    background: #4a5568;
  }
  .header-bar {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 20px;
  }
  .header-left {
    flex: 1;
  }
  #status { 
    font-weight: bold; 
    margin-top: 20px;
    padding: 15px;
    border-radius: 8px;
    min-height: 50px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 1.1em;
  }
  .status-success {
    background: #c6f6d5;
    color: #22543d;
    border: 2px solid #48bb78;
  }
  .status-error {
    background: #fed7d7;
    color: #742a2a;
    border: 2px solid #f56565;
  }
  .status-info {
    background: #bee3f8;
    color: #2c5282;
    border: 2px solid #4299e1;
  }
  .loading {
    display: inline-block;
    width: 20px;
    height: 20px;
    border: 3px solid #f3f3f3;
    border-top: 3px solid #667eea;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin-left: 10px;
  }
  @keyframes spin {
    0% { transform: rotate(0deg); }
    100% { transform: rotate(360deg); }
  }
  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-10px); }
    75% { transform: translateX(10px); }
  }
  .stats {
    margin-top: 20px;
    padding: 15px;
    background: #f7fafc;
    border-radius: 8px;
    border: 1px solid #e2e8f0;
    text-align: left;
  }
  .modal {
    display: none;
    position: fixed;
    z-index: 1000;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    background-color: rgba(0,0,0,0.5);
    animation: fadeIn 0.3s;
  }
  @keyframes fadeIn {
    from { opacity: 0; }
    to { opacity: 1; }
  }
  .modal-content {
    background-color: white;
    margin: 15% auto;
    padding: 30px;
    border-radius: 15px;
    width: 90%;
    max-width: 500px;
    box-shadow: 0 10px 40px rgba(0,0,0,0.3);
    animation: slideIn 0.3s;
  }
  @keyframes slideIn {
    from { transform: translateY(-50px); opacity: 0; }
    to { transform: translateY(0); opacity: 1; }
  }
  .modal-header {
    font-size: 1.5em;
    margin-bottom: 15px;
    color: #742a2a;
  }
  .modal-body {
    margin-bottom: 20px;
    color: #4a5568;
    line-height: 1.6;
    text-align: left;
  }
  .modal-buttons {
    display: flex;
    gap: 10px;
    justify-content: flex-end;
  }
  @media (max-width: 600px) {
    .container { padding: 20px; }
    h1 { font-size: 1.5em; }
    button { padding: 10px 20px; font-size: 14px; }
    .upload-area { padding: 30px 20px; }
    .header-bar { flex-direction: column; gap: 10px; }
  }
</style>
</head>
<body>
<div class="container">
  <!-- Login Screen -->
  <div id="loginScreen">
    <div class="login-icon">🔐</div>
    <div class="login-title">Face Recognition System</div>
    <div class="login-subtitle">Admin Access Required</div>
    <div class="password-input-group">
      <div class="password-wrapper">
        <input type="password" id="passwordInput" placeholder="Enter Password" onkeypress="handlePasswordKeypress(event)">
        <span class="toggle-password" onclick="togglePasswordVisibility()">👁️</span>
      </div>
      <button class="btn-primary" onclick="checkPassword()">🔓 Login</button>
      <div class="login-error" id="loginError"></div>
    </div>
  </div>

  <!-- Main Application (Hidden until login) -->
  <div id="mainApp">
    <div class="header-bar">
      <div class="header-left">
        <h1>🔐 Face Recognition Door Lock</h1>
        <p class="subtitle">Secure access control with facial recognition</p>
      </div>
      <button class="btn-logout" onclick="logout()">🚪 Logout</button>
    </div>
    
    <div class="upload-area" id="uploadArea" onclick="document.getElementById('fileInput').click()">
      <div class="upload-icon">📷</div>
      <div class="upload-text">Click to select an image</div>
      <div class="upload-hint">or drag and drop here</div>
      <div class="upload-hint" style="margin-top: 10px;">Supports: JPG, PNG, JPEG</div>
    </div>
    
    <input type="file" id="fileInput" accept="image/*" onchange="handleFileSelect(event)">
    
    <img id="preview" alt="Selected image preview">
    
    <div class="input-group">
      <input type="text" id="name" placeholder="Enter Name to Add (e.g., John Doe)">
    </div>
    
    <div class="button-group">
      <button class="btn-secondary" id="addBtn" onclick="addFace()" disabled>➕ Add Face</button>
      <button class="btn-primary" id="recognizeBtn" onclick="recognizeFace()" disabled>🔍 Recognize Face</button>
      <button class="btn-danger" id="clearBtn" onclick="clearImage()" disabled>🗑️ Clear Image</button>
      <button class="btn-info" onclick="listFaces()">📋 List Faces</button>
      <button class="btn-warning" onclick="showDeleteModal()">🗑️ Delete Data</button>
    </div>
    
    <div id="status"></div>
    <div id="stats" class="stats" style="display:none;"></div>
  </div>
</div>

<!-- Delete Confirmation Modal -->
<div id="deleteModal" class="modal">
  <div class="modal-content">
    <div class="modal-header">⚠️ Delete Face Data</div>
    <div class="modal-body">
      <p><strong>Choose what to delete:</strong></p>
      <div style="margin: 15px 0;">
        <input type="radio" id="deleteAll" name="deleteOption" value="all" checked>
        <label for="deleteAll" style="margin-left: 5px;">Delete ALL face data</label>
      </div>
      <div style="margin: 15px 0;">
        <input type="radio" id="deleteSpecific" name="deleteOption" value="specific">
        <label for="deleteSpecific" style="margin-left: 5px;">Delete specific person:</label>
        <input type="text" id="deleteName" placeholder="Enter name" style="margin-left: 10px; padding: 8px; border: 1px solid #ddd; border-radius: 5px; width: 200px;" disabled>
      </div>
      <p style="color: #e53e3e; margin-top: 15px;"><strong>⚠️ This action cannot be undone!</strong></p>
    </div>
    <div class="modal-buttons">
      <button class="btn-info" onclick="closeDeleteModal()" style="padding: 10px 20px;">Cancel</button>
      <button class="btn-danger" onclick="confirmDelete()" style="padding: 10px 20px;">Delete</button>
    </div>
  </div>
</div>

<script>
// ===== CONFIGURATION =====
const ADMIN_PASSWORD = "admin123"; // Change this to your desired password
const SERVER_PORT = 5000;

// ===== STATE MANAGEMENT =====
let selectedFile = null;
let isProcessing = false;
let isAuthenticated = false;

// ===== INITIALIZATION =====
window.onload = function() {
  if (sessionStorage.getItem('authenticated') === 'true') {
    isAuthenticated = true;
    showMainApp();
  }
  
  // Setup modal radio button handlers
  setupModalHandlers();
};

// ===== AUTHENTICATION =====
function togglePasswordVisibility() {
  const passwordInput = document.getElementById('passwordInput');
  const toggleIcon = document.querySelector('.toggle-password');
  
  if (passwordInput.type === 'password') {
    passwordInput.type = 'text';
    toggleIcon.textContent = '🙈';
  } else {
    passwordInput.type = 'password';
    toggleIcon.textContent = '👁️';
  }
}

function handlePasswordKeypress(event) {
  if (event.key === 'Enter') {
    checkPassword();
  }
}

function checkPassword() {
  const passwordInput = document.getElementById('passwordInput');
  const loginError = document.getElementById('loginError');
  const password = passwordInput.value;
  
  if (password === ADMIN_PASSWORD) {
    isAuthenticated = true;
    sessionStorage.setItem('authenticated', 'true');
    loginError.textContent = '';
    showMainApp();
  } else {
    loginError.textContent = '❌ Incorrect password. Please try again.';
    passwordInput.value = '';
    passwordInput.focus();
    passwordInput.style.animation = 'shake 0.5s';
    setTimeout(() => {
      passwordInput.style.animation = '';
    }, 500);
  }
}

function showMainApp() {
  document.getElementById('loginScreen').style.display = 'none';
  document.getElementById('mainApp').style.display = 'block';
  showStatus("Ready - Please select an image", "info");
}

function logout() {
  if (confirm('Are you sure you want to logout?')) {
    isAuthenticated = false;
    sessionStorage.removeItem('authenticated');
    document.getElementById('loginScreen').style.display = 'flex';
    document.getElementById('mainApp').style.display = 'none';
    document.getElementById('passwordInput').value = '';
    clearImage();
  }
}

// ===== FILE HANDLING =====
const uploadArea = document.getElementById('uploadArea');

uploadArea.addEventListener('dragover', (e) => {
  e.preventDefault();
  uploadArea.classList.add('dragover');
});

uploadArea.addEventListener('dragleave', () => {
  uploadArea.classList.remove('dragover');
});

uploadArea.addEventListener('drop', (e) => {
  e.preventDefault();
  uploadArea.classList.remove('dragover');
  
  const files = e.dataTransfer.files;
  if (files.length > 0) {
    const file = files[0];
    if (file.type.startsWith('image/')) {
      handleFile(file);
    } else {
      showStatus("⚠️ Please select an image file", "error");
    }
  }
});

function handleFileSelect(event) {
  const file = event.target.files[0];
  if (file) {
    handleFile(file);
  }
}

function handleFile(file) {
  selectedFile = file;
  
  const preview = document.getElementById('preview');
  const reader = new FileReader();
  
  reader.onload = (e) => {
    preview.src = e.target.result;
    preview.style.display = 'block';
    
    document.getElementById('addBtn').disabled = false;
    document.getElementById('recognizeBtn').disabled = false;
    document.getElementById('clearBtn').disabled = false;
    
    showStatus(`✅ Image loaded: ${file.name}`, "success");
  };
  
  reader.readAsDataURL(file);
}

function clearImage() {
  selectedFile = null;
  document.getElementById('preview').style.display = 'none';
  document.getElementById('preview').src = '';
  document.getElementById('fileInput').value = '';
  document.getElementById('addBtn').disabled = true;
  document.getElementById('recognizeBtn').disabled = true;
  document.getElementById('clearBtn').disabled = true;
  showStatus("Image cleared", "info");
}

// ===== SERVER COMMUNICATION =====
function getServerUrl() {
  const hostname = window.location.hostname || "127.0.0.1";
  return `http://${hostname}:${SERVER_PORT}`;
}

// ===== UI FEEDBACK =====
function showStatus(message, type = "info") {
  const statusEl = document.getElementById("status");
  statusEl.innerHTML = message;
  statusEl.className = `status-${type}`;
  
  // Auto-hide non-info messages after 5 seconds
  if (type !== "info") {
    clearTimeout(window.statusTimeout);
    window.statusTimeout = setTimeout(() => {
      statusEl.innerHTML = "";
      statusEl.className = "";
    }, 5000);
  }
}

function showLoading(message) {
  showStatus(message + '<span class="loading"></span>', "info");
}

// ===== FACE OPERATIONS =====
async function addFace() {
  if (isProcessing || !selectedFile) return;
  
  const name = document.getElementById('name').value.trim();
  if (!name) {
    showStatus("⚠️ Please enter a name first!", "error");
    return;
  }
  
  if (name.length < 2) {
    showStatus("⚠️ Name must be at least 2 characters", "error");
    return;
  }
  
  isProcessing = true;
  showLoading("📸 Adding face to database...");
  
  try {
    const formData = new FormData();
    formData.append("name", name);
    formData.append("image", selectedFile);
    
    const response = await fetch(`${getServerUrl()}/add_face`, {
      method: "POST",
      body: formData
    });
    
    const data = await response.json();
    
    if (data.status === "success") {
      showStatus(`✅ ${data.message} (Total: ${data.faces_count} faces)`, "success");
      document.getElementById('name').value = '';
      clearImage();
    } else {
      showStatus(`❌ ${data.message || "Error adding face"}`, "error");
    }
  } catch (error) {
    showStatus(`❌ Network error: ${error.message}. Is the server running?`, "error");
    console.error("Add face error:", error);
  } finally {
    isProcessing = false;
  }
}

async function recognizeFace() {
  if (isProcessing || !selectedFile) return;
  
  isProcessing = true;
  showLoading("🔍 Analyzing face...");
  
  try {
    const formData = new FormData();
    formData.append("image", selectedFile);
    
    const response = await fetch(`${getServerUrl()}/recognize_face`, {
      method: "POST",
      body: formData
    });
    
    const data = await response.json();
    
    if (data.status === "recognized") {
      const confidence = (data.confidence * 100).toFixed(1);
      showStatus(`✅ Access Granted! Welcome, ${data.name} (${confidence}% match)`, "success");
    } else if (data.status === "no_face") {
      showStatus("⚠️ No face detected in image", "error");
    } else if (data.status === "unknown") {
      showStatus("❌ Access Denied - Face not recognized", "error");
    } else if (data.status === "error") {
      showStatus(`❌ ${data.message}`, "error");
    } else {
      showStatus(`❌ Recognition failed`, "error");
    }
  } catch (error) {
    showStatus(`❌ Network error: ${error.message}. Is the server running?`, "error");
    console.error("Recognition error:", error);
  } finally {
    isProcessing = false;
  }
}

async function listFaces() {
  showLoading("📋 Loading face database...");
  
  try {
    const response = await fetch(`${getServerUrl()}/list_faces`);
    
    if (!response.ok) {
      throw new Error(`Server returned status ${response.status}`);
    }
    
    const data = await response.json();
    
    if (data.status === "success") {
      const statsEl = document.getElementById("stats");
      
      if (data.total === 0) {
        statsEl.innerHTML = "<strong>📭 No faces in database</strong><br><br>Add faces to get started!";
      } else {
        let html = `<strong>📊 Registered Faces (${data.total} total):</strong><br><br>`;
        for (const [name, count] of Object.entries(data.faces)) {
          html += `👤 <strong>${name}</strong>: ${count} image${count > 1 ? 's' : ''}<br>`;
        }
        statsEl.innerHTML = html;
      }
      
      statsEl.style.display = "block";
      showStatus("✅ Database loaded successfully", "success");
    } else {
      showStatus(`❌ ${data.message || "Failed to load faces"}`, "error");
      document.getElementById("stats").style.display = "none";
    }
  } catch (error) {
    showStatus(`❌ Network error: ${error.message}. Is the server running?`, "error");
    console.error("List faces error:", error);
    document.getElementById("stats").style.display = "none";
  }
}

// ===== DELETE OPERATIONS =====
function setupModalHandlers() {
  const deleteAll = document.getElementById('deleteAll');
  const deleteSpecific = document.getElementById('deleteSpecific');
  const deleteName = document.getElementById('deleteName');
  
  if (deleteAll && deleteSpecific && deleteName) {
    deleteAll.addEventListener('change', function() {
      if (this.checked) {
        deleteName.disabled = true;
        deleteName.value = '';
      }
    });
    
    deleteSpecific.addEventListener('change', function() {
      if (this.checked) {
        deleteName.disabled = false;
        deleteName.focus();
      }
    });
  }
}

function showDeleteModal() {
  document.getElementById('deleteModal').style.display = 'block';
}

function closeDeleteModal() {
  document.getElementById('deleteModal').style.display = 'none';
  document.getElementById('deleteAll').checked = true;
  document.getElementById('deleteName').value = '';
  document.getElementById('deleteName').disabled = true;
}

async function confirmDelete() {
  const deleteOption = document.querySelector('input[name="deleteOption"]:checked').value;
  const deleteName = document.getElementById('deleteName').value.trim();
  
  if (deleteOption === 'specific' && !deleteName) {
    showStatus("⚠️ Please enter a name to delete", "error");
    return;
  }
  
  closeDeleteModal();
  
  if (deleteOption === 'all') {
    await deleteAllFaces();
  } else {
    await deleteSpecificFace(deleteName);
  }
}

async function deleteAllFaces() {
  showLoading("🗑️ Deleting all face data...");
  
  try {
    const response = await fetch(`${getServerUrl()}/delete_all_faces`, {
      method: "POST"
    });
    
    const data = await response.json();
    
    if (data.status === "success") {
      showStatus(`✅ ${data.message}`, "success");
      document.getElementById("stats").style.display = "none";
    } else {
      showStatus(`❌ ${data.message || "Error deleting faces"}`, "error");
    }
  } catch (error) {
    showStatus(`❌ Network error: ${error.message}. Is the server running?`, "error");
    console.error("Delete all error:", error);
  }
}

async function deleteSpecificFace(name) {
  showLoading(`🗑️ Deleting ${name}...`);
  
  try {
    const response = await fetch(`${getServerUrl()}/delete_face`, {
      method: "POST",
      headers: {
        "Content-Type": "application/json"
      },
      body: JSON.stringify({ name: name })
    });
    
    const data = await response.json();
    
    if (data.status === "success") {
      showStatus(`✅ ${data.message}`, "success");
      setTimeout(() => listFaces(), 1000);
    } else {
      showStatus(`❌ ${data.message || "Error deleting face"}`, "error");
    }
  } catch (error) {
    showStatus(`❌ Network error: ${error.message}. Is the server running?`, "error");
    console.error("Delete face error:", error);
  }
}

// ===== MODAL CLICK OUTSIDE TO CLOSE =====
window.onclick = function(event) {
  const modal = document.getElementById('deleteModal');
  if (event.target === modal) {
    closeDeleteModal();
  }
};
</script>
</body>
</html>
